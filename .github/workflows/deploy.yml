name: 每日采集并部署看板

on:
  push:
    branches: [main]
    paths:
      - "render_dashboard.py"
      - "aigc_trend_brief.py"
      - "translate_descriptions.js"
      - "package.json"
      - "package-lock.json"
      - "project_discovery.py"
      - "run_daily.sh"
      - "tests/**"
      - ".github/workflows/deploy.yml"
  # UTC 01:05 = 北京时间 09:05（定时任务为尽力而为，偶发延迟属正常）
  schedule:
    - cron: "5 1 * * *"
  # 支持在 Actions 页面手动触发（可指定回溯天数）
  workflow_dispatch:
    inputs:
      days:
        description: "回溯天数"
        required: false
        default: "30"
      refresh_discovery:
        description: "只更新已有资料的学习解读（跳过重新采集）"
        type: boolean
        default: false
      llm_limit:
        description: "本次最多尝试分析多少个项目"
        required: false
        default: "90"

# GITHUB_TOKEN 权限：回写产物到仓库 + 发布 Pages
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只允许一次部署，避免并发发布互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装免登录翻译客户端
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 采集数据并渲染看板
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://ark.cn-beijing.volces.com/api/v3' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'doubao-seed-1-6-250615' }}
          GITHUB_TOKEN: ${{ github.token }}
          WINDOW_DAYS: ${{ github.event.inputs.days || '30' }}
          # 代码发布复用资料；每日定时任务继续完整采集。
          REFRESH_DISCOVERY: ${{ github.event_name == 'push' && 'true' || github.event.inputs.refresh_discovery || 'false' }}
          # 代码发布先以 3 个项目验证模型协议；每日滚动处理 90 个，约 30 次模型请求。
          LLM_LIMIT: ${{ github.event_name == 'push' && '3' || github.event.inputs.llm_limit || '90' }}
        run: |
          chmod +x run_daily.sh
          ./run_daily.sh "$WINDOW_DAYS"

      - name: 校验学习卡与趋势口径
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 回写当日数据与看板到仓库（归档）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/aigc_data.json output/aigc_brief.md site/index.html
          if git diff --cached --quiet; then
            echo "今日产物无变化，跳过提交"
          else
            git commit -m "chore(data): 每日趋势数据与看板更新 $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
