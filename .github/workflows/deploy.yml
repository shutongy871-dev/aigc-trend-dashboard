name: 每日采集并部署看板

on:
  push:
    branches: [main]
    # 每次 main 推送都更新入口；仅静态文件变更时不重跑采集和生成器。
  # UTC 01:05 = 北京时间 09:05（定时任务为尽力而为，偶发延迟属正常）
  schedule:
    - cron: "5 1 * * *"
  # 支持在 Actions 页面手动触发（可指定回溯天数）
  workflow_dispatch:
    inputs:
      days:
        description: "回溯天数"
        required: false
        default: "90"
      refresh_discovery:
        description: "只更新已有资料的学习解读（跳过重新采集）"
        type: boolean
        default: false
      llm_limit:
        description: "本次最多尝试分析多少个项目"
        required: false
        default: "90"
      builders_only:
        description: "仅刷新 Builder 推文（不采集项目、不调用模型）"
        type: boolean
        default: false
  workflow_call:
    inputs:
      builders_only:
        type: boolean
        default: false

# GITHUB_TOKEN 权限：回写产物到仓库 + 发布 Pages
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只允许一次部署，避免并发发布互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.archive.outputs.publish }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 判断是否需要生成看板
        id: render
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          BUILDERS_ONLY: ${{ inputs.builders_only || false }}
        run: |
          echo "builders_only=${BUILDERS_ONLY:-false}" >> "$GITHUB_OUTPUT"
          if [[ "$WORKFLOW_EVENT" != "push" ]] || [[ ! -f site/index.html ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet "$PUSH_BEFORE_SHA" HEAD -- \
            render_dashboard.py aigc_trend_brief.py project_discovery.py \
            translate_descriptions.js package.json package-lock.json \
            run_daily.sh builder_feed.py output/aigc_data.json output/builder_feed.json; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装免登录翻译客户端
        if: steps.render.outputs.needed == 'true' && steps.render.outputs.builders_only != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 采集数据并渲染看板
        if: steps.render.outputs.needed == 'true' && steps.render.outputs.builders_only != 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://ark.cn-beijing.volces.com/api/v3' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'doubao-seed-1-6-250615' }}
          GITHUB_TOKEN: ${{ github.token }}
          WINDOW_DAYS: ${{ github.event.inputs.days || '90' }}
          # 代码发布复用资料；每日定时任务继续完整采集。
          REFRESH_DISCOVERY: ${{ github.event_name == 'push' && 'true' || github.event.inputs.refresh_discovery || 'false' }}
          # 代码发布不重试外部模型；每日滚动处理 90 个，约 30 次模型请求。
          LLM_LIMIT: ${{ github.event_name == 'push' && '0' || github.event.inputs.llm_limit || '90' }}
        run: |
          chmod +x run_daily.sh
          ./run_daily.sh "$WINDOW_DAYS"

      - name: 仅刷新 Builder 推文并渲染看板
        if: steps.render.outputs.needed == 'true' && steps.render.outputs.builders_only == 'true'
        run: |
          python builder_feed.py --out output/builder_feed.json
          python render_dashboard.py --data output/aigc_data.json --builders output/builder_feed.json --out site/index.html

      - name: 校验学习卡与趋势口径
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: 校验新旧入口跳转与部署配置
        run: node --test tests/vercel_redirect.cjs tests/deploy_workflow.cjs

      - name: 回写当日数据与看板到仓库（归档）
        id: archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source_sha="$(git rev-parse HEAD)"
          git add output/aigc_data.json output/aigc_brief.md site/index.html
          if [[ -f output/builder_feed.json ]]; then
            git add output/builder_feed.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): 每日趋势数据与看板更新 $(date -u +%Y-%m-%d)"
          fi

          # 生成期间 main 可能收到新提交。只合入不影响产物的变更；
          # 若源码、数据或网页已更新，交由较新的运行发布，绝不覆盖它们。
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$source_sha" origin/main -- \
              render_dashboard.py aigc_trend_brief.py project_discovery.py \
              translate_descriptions.js package.json package-lock.json run_daily.sh \
              builder_feed.py output/builder_feed.json \
              output/aigc_data.json output/aigc_brief.md site/index.html; then
              echo "检测到更新的源码或产物，跳过过期发布。"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::归档连续三次推送失败，停止发布，保留当前线上版本。"
          exit 1

      - name: 配置 GitHub Pages
        if: steps.archive.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        if: steps.archive.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
